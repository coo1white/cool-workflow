name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cool-workflow:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        node-version: ["18", "22"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/cool-workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-package-lock --ignore-scripts
      # Zero runtime deps means this only ever audits the 3 devDependencies
      # (typescript, @types/node, undici-types), but a high/critical advisory
      # in any of them still runs in CI and in every contributor's install —
      # fail closed rather than finding out from an external report.
      - run: npm audit --audit-level=high
      - run: npm run build
      # Committed dist/ must equal a fresh build of src/ (fail closed on drift).
      # `git status --porcelain` catches modified AND added/deleted dist files;
      # `git diff` would miss untracked ones. release:check re-verifies via dist:check.
      - run: |
          drift="$(git status --porcelain -- dist)"
          if [ -n "$drift" ]; then
            echo "committed dist/ is stale — rebuild with 'npm run build' and commit:"
            echo "$drift"
            exit 1
          fi
      - run: npm run check
      - run: node scripts/cw.js list
      - run: node scripts/cw.js schedule list
      # Black-box regression net: the shipping cli.js must stay byte-identical
      # in observable behavior. This is the guardrail CHANGELOG.md's 0.2.0 entry
      # promises; it must run in CI or that promise is false.
      - run: node ../../v2/conformance/run.js --bin dist/cli.js
      # `test:coverage` already runs the full smoke suite; keep release:check for
      # the remaining parity, manifest, version-sync, golden-path, canonical-apps,
      # and eval gates without running the same suite a second time.
      - run: npm run test:coverage
      # Pure core/ unit tests (test/*.test.js), separate from the smoke suite
      # above — see test/run-unit.js's header. release:check --skip-tests also
      # skips this by name, so it does not run twice.
      - run: npm run test:unit
      - run: npm run release:check -- --skip-tests
