name: release-gate
# Out-of-band backstop: re-runs the deterministic gate on every tag push.
# Local hooks can in principle be bypassed by an agent with shell access;
# this workflow cannot. Pair with a GitHub ruleset that protects refs/tags/v*
# so a red run blocks the release from being treated as published.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # need full history + previous tags

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install
        # `npm ci` (not `npm install --no-package-lock`) even though this
        # package ships zero runtime dependencies -- that fact is about the
        # SHIPPED artifact, not about what runs IN THIS JOB. `npm ci` still
        # installs DEV tooling (tsc, etc), and that dev tooling is CODE that
        # runs here, inside a job that feeds the publish job's OIDC-privileged
        # install. Pinning it to the tracked, reviewed package-lock.json (kept
        # in sync by scripts/version-sync-check.js) is what buys real control
        # over what code runs in CI -- do not "fix" this back to
        # `npm install --no-package-lock`. --ignore-scripts: a poisoned
        # transitive install script must not get to run here either.
        run: npm ci --ignore-scripts --prefix plugins/cool-workflow

      - name: Run deterministic release gate
        run: bash plugins/cool-workflow/scripts/release-gate.sh

      - name: Verify reviewer verdict was committed
        # If .cw-release/verdict-signing.pub is committed (see
        # scripts/verdict-keygen.js), ALSO require a valid ed25519 signature on
        # the matched verdict, AND — when the match is at HEAD~1 (the
        # "tolerate the release commit" path) — require HEAD to reproduce
        # EXACTLY as the deterministic bump commit release-flow.js's cut()
        # would have produced on top of the approved parent
        # (scripts/verify-bump-reproduction.sh). A validly-signed verdict for
        # the PARENT alone does not prove HEAD is that same mechanical bump —
        # it could be an attacker's own commit smuggling arbitrary changes on
        # top of an old, genuinely-approved parent, replaying that parent's
        # already-public verdict + signature (public git objects, no secret
        # needed to copy them). Until verdict-signing.pub exists in the repo,
        # this stays the original grep-only check, unchanged (opt-in,
        # backward compatible).
        run: |
          SHA=$(git rev-parse HEAD^{commit})
          # Read the pubkey from origin/main, NOT from the checked-out tree. For a
          # tag push the checked-out tree IS the commit under test — an attacker's
          # tag could just delete .cw-release/verdict-signing.pub and fall back to
          # a no-signature check. origin/main is a ref the tag being judged cannot
          # rewrite. fetch-depth: 0 above already gives us this ref with no extra
          # fetch.
          PUBKEY=""
          if PUBKEY_CONTENT="$(git show origin/main:.cw-release/verdict-signing.pub 2>/dev/null)" && [ -n "$PUBKEY_CONTENT" ]; then
            PUBKEY="$(mktemp)"
            printf '%s\n' "$PUBKEY_CONTENT" > "$PUBKEY"
          fi
          # The tag commit itself bumps version/changelog; the reviewed sha is its parent
          # Accept a verdict for HEAD or HEAD~1 to tolerate the release commit.
          for C in "$SHA" "$(git rev-parse HEAD~1 2>/dev/null || echo none)"; do
            VERDICT=".cw-release/review-$C.verdict"
            [ -f "$VERDICT" ] || continue
            FIRST_LINE="$(head -n1 "$VERDICT")"
            [ "$FIRST_LINE" = "APPROVED $C" ] || continue
            if [ -n "$PUBKEY" ]; then
              SIG="$VERDICT.sig"
              if [ -f "$SIG" ] && node plugins/cool-workflow/scripts/verify-verdict-signature.js "$VERDICT" "$SIG" "$PUBKEY"; then
                if [ "$C" != "$SHA" ]; then
                  if ! bash plugins/cool-workflow/scripts/verify-bump-reproduction.sh "$C" "$SHA" "$VERDICT" "$SIG"; then
                    echo "verdict for $C has a valid signature but HEAD does not reproduce as its deterministic bump — trying the other candidate"
                    continue
                  fi
                fi
                echo "verdict found + signature verified for $C"; exit 0
              fi
              echo "verdict for $C has no valid signature — trying the other candidate"
              continue
            fi
            echo "verdict found for $C (no verdict-signing.pub committed yet — signature not required)"; exit 0
          done
          echo "::error::No committed APPROVED verdict for this tag (with a valid signature, if .cw-release/verdict-signing.pub is committed). The release flow was bypassed."
          echo "::error::Expected: .cw-release/review-<sha>.verdict with first line 'APPROVED <sha>' — auto-created by release-flow.js --cut"
          exit 1
