<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cool Workflow Workbench</title>
    <!-- No bundler, no network. app.css is built by Tailwind + daisyUI (npm run
         build:css) from the classes in this file and app.js; paths are
         relative so the same files work at / and under a site prefix. All
         data comes from the two read-only JSON routes. -->
    <link rel="stylesheet" href="./ui/app.css" />
  </head>
  <body class="flex h-screen flex-col bg-base-100 font-sans text-[14px] leading-[1.45] text-base-content">
    <header class="flex min-h-[56px] items-center justify-between gap-4 border-b border-base-300 px-5">
      <div class="flex items-center gap-3">
        <span class="flex h-7 w-7 items-center justify-center rounded-[7px] bg-primary text-base-100" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9"></path><path d="M4 12h6"></path><path d="M12 15l3 3 6-7"></path></svg></span>
        <h1 class="text-[14px] font-extrabold uppercase tracking-[.12em]">Cool Workflow <span class="text-[13px] font-normal normal-case tracking-normal text-base-content/60">Workbench</span></h1>
      </div>
      <div class="flex items-center gap-4">
        <p class="font-mono text-[11px] uppercase tracking-[.08em] text-base-content/60">read-only · localhost · re-derived from <code class="text-base-content">.cw/</code> on every refresh</p>
        <button id="refresh" class="btn btn-outline btn-sm gap-1.5 font-normal normal-case" title="Re-derive from disk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 3v6h-6"></path></svg>Refresh</button>
      </div>
    </header>
    <main class="grid min-h-0 flex-1 grid-cols-[300px_minmax(0,1fr)]">
      <section id="index-panel" class="flex flex-col gap-2.5 overflow-y-auto border-r border-base-300 px-3 py-3.5">
        <div class="flex items-center justify-between px-1">
          <h2 class="font-mono text-[11px] font-normal uppercase tracking-[.08em]">Runs</h2>
          <div id="registry-freshness"></div>
        </div>
        <input id="filter" type="search" class="input input-sm input-bordered w-full" placeholder="filter runs · app, status, text" aria-label="filter runs" />
        <ul id="run-list" class="menu menu-sm gap-0.5 p-0"></ul>
      </section>
      <section id="run-panel" class="flex flex-col gap-4 overflow-y-auto px-6 py-5">
        <p class="text-base-content/60">Select a run to inspect its graph, blackboard, worker logs, candidate compare, and audit timeline.</p>
      </section>
    </main>
    <script src="./ui/navigation.js"></script>
    <script src="./ui/inspection.js"></script>
    <script src="./ui/app.js"></script>
  </body>
</html>
