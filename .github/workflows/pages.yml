name: Pages

# The Workbench and report.html, as one static snapshot of a real run, at
# https://coo1white.github.io/cool-workflow/ . Every push to main makes a
# fresh run with the release-cut app (node backend, no agent, no secret),
# turns the two JSON routes into files, and publishes them with the UI.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/cool-workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun install --frozen-lockfile && bun run build
        working-directory: plugins/cool-workflow/ui/workbench
        env:
          WORKBENCH_ASSET_PREFIX: /cool-workflow/ui
      - run: bun run dogfood:release
      - run: node scripts/site-snapshot.js ../../site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
