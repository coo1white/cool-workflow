name: npm-publish

# Publish cool-workflow to npm from the pushed v* release tag itself.
#
# Why a tag push and not workflow_run: npm provenance names the commit that
# STARTED the run (GITHUB_SHA). A workflow_run run starts on the default
# branch, so 0.3.3-0.4.2 named main's head, not the tag commit that was built,
# and npmjs.com shows "Unable to fetch the source commit". On a tag push,
# GITHUB_SHA is the tag commit, so the provenance names what was built.
#
# Trust: on a tag push this file comes from the tag, so a tag could edit it.
# What a tag cannot edit:
#   1. the `npm` environment (repo Settings -> Environments): only v* tags may
#      deploy to it, and the operator must approve each run;
#   2. npm's Trusted Publisher setting for this package, which accepts only
#      this workflow file running in the `npm` environment. A run without
#      `environment: npm` gets no publish right from npm at all.
# On top of that, every run re-checks the signed verdict with the verifier
# taken from origin/main (a ref the tag cannot rewrite), re-runs the
# deterministic release gate, and requires the tag to match the committed
# package version. Publishes through npm Trusted Publishing with provenance;
# no long-lived npm publish token is used.
#
# Automatic releases: release.yml's auto-patch job pushes the tag with
# GITHUB_TOKEN (which starts no tag-push run) and then dispatches this
# workflow on that tag ref, so GITHUB_SHA is still the tag commit. The tag
# carries no verdict; the verifier accepts it only by its automatic release
# rule (the next patch or minor, the exact bump of a main commit CI passed), which asks the
# GitHub API for that CI result, hence `actions: read` below.

on:
  push:
    tags:
      - "v*"
  # Re-publish an existing tag by hand: choose the TAG (not a branch) under
  # "Use workflow from". A branch is refused by the job-level `if:` below.
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the verifier reads the CI result for an automatic patch tag
  id-token: write # required for npm Trusted Publishing / provenance

# Queue, never cancel: a duplicate trigger for the same tag must queue behind
# an in-flight publish, never cancel it mid-`npm publish`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Only a v* tag ref may publish, on both triggers.
    if: startsWith(github.ref, 'refs/tags/v')
    # Protected environment: v* tags only, operator approval per run, and the
    # name npm's Trusted Publisher setting requires.
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/cool-workflow
    steps:
      # Pinned by commit SHA (not the moving @v5 tag) — this job holds the
      # npm Trusted Publishing OIDC token, so a compromise of the actions org
      # re-tagging @v5 to a malicious commit must not silently flow in here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag commit itself (GITHUB_SHA on a tag push or a dispatch on
          # the tag). fetch-depth 0 + tags: the verdict check reads history.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1
      - name: Use npm with Trusted Publishing support
        # Exact pin (no ^ range): this job holds the npm Trusted Publishing
        # OIDC token, so npm itself is code we do not want to float on a
        # compromised upstream release.
        run: npm install -g npm@11.5.1
      - name: Resolve the release tag from the ref
        id: tagref
        # GITHUB_REF / GITHUB_REF_NAME go through the environment and "$VAR",
        # never raw ${{ }} text: a tag name may carry shell metacharacters.
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) REF="$GITHUB_REF_NAME" ;;
            *) echo "::error::$GITHUB_REF is not a v* release tag — refusing to publish"; exit 1 ;;
          esac
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "resolved release tag: $REF"
      - name: Verify the tag matches the committed package version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          REF="$TAG_REF"
          TAG="${REF#v}"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package version $PKG — refusing to publish a mismatched artifact"
            exit 1
          fi
        env:
          TAG_REF: ${{ steps.tagref.outputs.ref }}
      - name: Take the release verifier from origin/main, not from the tag
        # The checked-out tree IS the tag under judgment: a tag whose own
        # scripts/verify-release-verdict.mjs is `process.exit(0)` would pass any
        # check that runs it. So the verifier (and every local file it loads) is
        # read out of origin/main -- a ref the tag being judged cannot rewrite --
        # into $RUNNER_TEMP, and the next step runs it from there against the
        # tag checkout (its cwd). If origin/main cannot be fetched or lacks any
        # of these files, this step fails and nothing goes on (fail closed).
        run: |
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          VDIR="$RUNNER_TEMP/cw-release-verifier"
          rm -rf "$VDIR"
          mkdir -p "$VDIR"
          printf '{"type":"commonjs"}\n' > "$VDIR/package.json"
          for f in verify-release-verdict.mjs verify-verdict-signature.mjs verify-bump-reproduction.mjs fake-date-for-reproduction.mjs; do
            if ! git show "origin/main:plugins/cool-workflow/scripts/$f" > "$VDIR/$f" || [ ! -s "$VDIR/$f" ]; then
              echo "origin/main has no plugins/cool-workflow/scripts/$f -- refusing to verify with the tag's own copy" >&2
              exit 1
            fi
          done
          echo "release verifier taken from origin/main $(git rev-parse origin/main)"
      - name: Verify the dispatched ref is a real, gated release tag
        # This step runs on EVERY invocation of this job (tag push and
        # dispatch on a tag). It is the source of truth for "was this release
        # really gated and reviewed": release.yml's gate runs from the pushed
        # tag's OWN tree, and so does this file, so neither one's own logic is
        # trusted alone. This step takes the tag ($TAG_REF, from the earlier
        # "Resolve the release tag from the ref" step), requires
        # refs/tags/$TAG_REF to exist as a real tag object, requires the
        # checked-out commit to be exactly that tag's commit (blocks a
        # same-named branch standing in for the tag), and re-runs the full
        # verdict check -- including its signature check and its
        # deterministic-bump-reproduction check (verify-bump-reproduction.mjs),
        # if .cw-release/verdict-signing.pub is committed (see verdict-keygen.mjs).
        # A validly-signed verdict for the PARENT alone does not prove HEAD is
        # the same mechanical bump release-flow.mjs's cut() would have produced —
        # the shared script's header comment keeps the full rationale. The
        # tag-identity checks below are THIS file's own logic; the verdict
        # check itself is delegated to verify-release-verdict.mjs AS COMMITTED ON
        # origin/main (copied out by the step above, never the tag's own copy),
        # which judges the repo of its cwd -- the tag checkout here (it anchors
        # itself on `git rev-parse --show-toplevel`).
        run: |
          REF="$TAG_REF"
          TAG_SHA="$(git rev-parse --verify "refs/tags/$REF^{commit}" 2>/dev/null)" || {
            echo "::error::refs/tags/$REF does not exist — the ref being published must be a real, pushed release tag, not a branch"
            exit 1
          }
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::checked-out commit $HEAD_SHA does not match refs/tags/$REF ($TAG_SHA) — refusing to publish"
            exit 1
          fi
          node "$RUNNER_TEMP/cw-release-verifier/verify-release-verdict.mjs" --context "Publishing cannot be used to skip the gated release flow."
        env:
          TAG_REF: ${{ steps.tagref.outputs.ref }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify committed dist/ matches source (fail closed on drift)
        run: |
          # bun install --frozen-lockfile (not a plain `bun install`): this job
          # holds the npm Trusted Publishing OIDC token, so the dev tooling
          # `bun run build` runs next (tsc, etc) is code we want pinned to the
          # tracked, reviewed bun.lock, not floating. --ignore-scripts: a
          # poisoned transitive install script must not get to run here either.
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          drift="$(git status --porcelain -- dist)"
          if [ -n "$drift" ]; then
            echo "::error::committed dist/ is stale — rebuild with 'bun run build' and commit:"
            echo "$drift"
            exit 1
          fi
          echo "dist/ is fresh — proceeding to publish"
      - name: Run deterministic release gate
        # The same gate release.yml runs on this tag. It used to be trusted
        # here through workflow_run's "release succeeded"; with a tag-push
        # trigger the two run side by side, so this job runs it itself.
        # (Its install is the frozen-lockfile one in the step above.)
        working-directory: ${{ github.workspace }}
        run: node plugins/cool-workflow/scripts/release-gate.mjs
      - name: Skip if this version is already published (idempotent re-run)
        id: published
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "cool-workflow@$PKG" version >/dev/null 2>&1; then
            echo "cool-workflow@$PKG is already on npm — skipping publish. A tag move or"
            echo "re-dispatch must never double-publish or fail closed on an already-shipped version."
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm (with provenance)
        if: steps.published.outputs.already != 'true'
        run: npm publish --access public
