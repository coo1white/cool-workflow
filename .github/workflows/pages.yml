name: Pages

# report.html, as one static snapshot of a real run, at
# https://coo1white.github.io/cool-workflow/ . Every push to main makes a
# fresh `cw -q` run over this repository (a stub agent, no secret) and
# publishes its report.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/cool-workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      # One `cw -q` run over this repository makes the report the site shows.
      # Pages has no agent, so the run uses the test stub agent: the page
      # shows CW's report, not a model's review.
      - run: node -e 'import("./test/helpers/stub-agent.mjs").then((m) => m.writeStubAgent(process.argv[1]))' "$RUNNER_TEMP/stub-agent.cjs"
      - run: node scripts/cw.js -q "What does this repository do?" --repo ../.. --json > /dev/null
        env:
          CW_AGENT_COMMAND: node ${{ runner.temp }}/stub-agent.cjs {{result}}
          CW_NO_AUTO_AGENT: "1"
          CW_NO_OPEN: "1"
      - run: node scripts/site-snapshot.mjs ../../site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
