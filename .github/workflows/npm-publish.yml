name: npm-publish

# Publish cool-workflow to npm when a release tag is pushed (or on manual
# dispatch for an existing tag). A v* tag can only land after the gated release
# flow (deterministic gate -> independent reviewer -> verdict -> the
# block-unapproved-tag hook). The workflow_run trigger only fires after
# release-gate succeeds, so that path already implies an approved release.
# workflow_dispatch accepts an arbitrary operator-given ref, so it gets its own
# checks: the ref must resolve to a real refs/tags/v* commit (not a same-named
# branch), and the same committed-verdict check release-gate.yml runs on tag
# push is re-run here. On top of both paths, the tag must match the committed
# package version, so a stray tag can never publish a mismatched artifact.
# Publishes through npm Trusted Publishing with provenance — a
# cryptographic attestation that this exact version was built from this public
# repo in CI, on-brand for an auditable control-plane and impossible to forge
# for a hand-published tarball. No long-lived npm publish token is needed.

on:
  workflow_run:
    workflows: ["release-gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to publish (e.g. v0.1.79)"
        required: true

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing / provenance

jobs:
  publish:
    # Gate as a job-level condition (NOT a pre-checkout run-step): on workflow_run
    # only proceed if release-gate succeeded; workflow_dispatch is always allowed.
    # A run-step here would execute under the job's working-directory before
    # actions/checkout has created it, so the shell could not even start.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/cool-workflow
    steps:
      # Pinned by commit SHA (not the moving @v5 tag) — this job holds the
      # npm Trusted Publishing OIDC token, so a compromise of the actions org
      # re-tagging @v5 to a malicious commit must not silently flow in here.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Check out the exact commit the gate ran on (a tag commit); on dispatch,
          # the operator-supplied tag. fetch-depth 0 + tags so we can resolve the
          # tag name from the commit below.
          ref: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Use npm with Trusted Publishing support
        run: npm install -g npm@^11.5.1
      - name: Resolve the release tag from the commit
        id: tagref
        # INPUT_REF/HEAD_SHA go through env:, not raw ${{ }} text substitution —
        # INPUT_REF is an operator-supplied dispatch string and could carry
        # shell metacharacters ($, `, ;, etc); env: + "$VAR" lets the shell
        # quote it safely instead of splicing it into the script text.
        run: |
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
          else
            # workflow_run: head_branch is the triggering branch (e.g. 'main'), NOT
            # the tag — derive the tag from the commit the gate actually ran on.
            REF="$(git describe --tags --exact-match "$HEAD_SHA")"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "resolved release tag: $REF"
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Verify the tag matches the committed package version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          REF="$TAG_REF"
          TAG="${REF#v}"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package version $PKG — refusing to publish a mismatched artifact"
            exit 1
          fi
        env:
          TAG_REF: ${{ steps.tagref.outputs.ref }}
      - name: Verify the dispatched ref is a real, gated release tag
        # workflow_dispatch lets an operator name any ref. Without this check, a
        # branch named e.g. "v9.9.9" with a matching package.json version and a
        # fresh dist/ would sail through every check above and publish with no
        # release-gate run and no committed reviewer verdict ever having existed.
        # Require refs/tags/$REF to exist as a real tag object, require the
        # checked-out commit to be exactly that tag's commit (blocks a same-named
        # branch standing in for the tag), and re-run the same verdict check
        # release-gate.yml runs on tag push — including its signature check and
        # its deterministic-bump-reproduction check (verify-bump-reproduction.sh),
        # if .cw-release/verdict-signing.pub is committed (see verdict-keygen.js).
        # A validly-signed verdict for the PARENT alone does not prove HEAD is
        # the same mechanical bump release-flow.js's cut() would have produced —
        # it could be an attacker's own commit smuggling arbitrary changes on
        # top of an old, genuinely-approved parent, replaying that parent's
        # already-public verdict + signature.
        #
        # .cw-release/ lives at the REPO ROOT, not under this job's
        # working-directory (plugins/cool-workflow) — anchor on
        # `git rev-parse --show-toplevel` rather than a relative path, since a
        # bare `.cw-release/...` here would silently resolve under
        # plugins/cool-workflow/ and never match, failing every legitimate
        # dispatch closed for the wrong reason.
        if: github.event_name == 'workflow_dispatch'
        run: |
          REF="$TAG_REF"
          TAG_SHA="$(git rev-parse --verify "refs/tags/$REF^{commit}" 2>/dev/null)" || {
            echo "::error::refs/tags/$REF does not exist — workflow_dispatch must name a real, pushed release tag, not a branch"
            exit 1
          }
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::checked-out commit $HEAD_SHA does not match refs/tags/$REF ($TAG_SHA) — refusing to publish"
            exit 1
          fi
          REPO_ROOT="$(git rev-parse --show-toplevel)"
          PUBKEY="$REPO_ROOT/.cw-release/verdict-signing.pub"
          for C in "$HEAD_SHA" "$(git rev-parse HEAD~1 2>/dev/null || echo none)"; do
            VERDICT_REL=".cw-release/review-$C.verdict"
            VERDICT="$REPO_ROOT/$VERDICT_REL"
            [ -f "$VERDICT" ] || continue
            grep -q '^APPROVED' "$VERDICT" || continue
            if [ -f "$PUBKEY" ]; then
              SIG="$VERDICT.sig"
              SIG_REL="$VERDICT_REL.sig"
              if [ -f "$SIG" ] && node scripts/verify-verdict-signature.js "$VERDICT" "$SIG" "$PUBKEY"; then
                if [ "$C" != "$HEAD_SHA" ]; then
                  if ! bash scripts/verify-bump-reproduction.sh "$C" "$HEAD_SHA" "$VERDICT_REL" "$SIG_REL"; then
                    echo "verdict for $C has a valid signature but HEAD does not reproduce as its deterministic bump — trying the other candidate"
                    continue
                  fi
                fi
                echo "verdict found + signature verified for $C"
                exit 0
              fi
              echo "verdict for $C has no valid signature — trying the other candidate"
              continue
            fi
            echo "verdict found for $C (no verdict-signing.pub committed yet — signature not required)"
            exit 0
          done
          echo "::error::No committed APPROVED verdict for this tag (with a valid signature, if .cw-release/verdict-signing.pub is committed). workflow_dispatch cannot be used to skip the gated release flow."
          echo "::error::Expected: .cw-release/review-<sha>.verdict with first line 'APPROVED <sha>'"
          exit 1
        env:
          TAG_REF: ${{ steps.tagref.outputs.ref }}
      - name: Verify committed dist/ matches source (fail closed on drift)
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run build
          drift="$(git status --porcelain -- dist)"
          if [ -n "$drift" ]; then
            echo "::error::committed dist/ is stale — rebuild with 'npm run build' and commit:"
            echo "$drift"
            exit 1
          fi
          echo "dist/ is fresh — proceeding to publish"
      - name: Skip if this version is already published (idempotent re-run)
        id: published
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "cool-workflow@$PKG" version >/dev/null 2>&1; then
            echo "cool-workflow@$PKG is already on npm — skipping publish. A tag move or"
            echo "re-dispatch must never double-publish or fail closed on an already-shipped version."
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm (with provenance)
        if: steps.published.outputs.already != 'true'
        run: npm publish --access public
