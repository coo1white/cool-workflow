name: release
# Out-of-band backstop: re-runs the deterministic gate on every tag push.
# Local hooks can in principle be bypassed by an agent with shell access;
# this workflow cannot. Pair with a GitHub ruleset that protects refs/tags/v*
# so a red run blocks the release from being treated as published.
#
# The gate job re-checks the release; the release job (needs: gate) makes
# the GitHub Release. Folded from release-gate.yml + github-release.yml.
# npm-publish.yml runs on the same tag push beside this one and re-runs the
# gate itself.
#
# The auto-patch job is the automatic patch release (release-tooling(7),
# "Automatic patch releases"): after a push to main whose CI run concluded
# success, it tags the next patch on a bump commit made on top of that run's
# commit, pushes only the tag, starts npm-publish.yml on it and makes the
# GitHub Release. A tag pushed with GITHUB_TOKEN starts no `push: tags` run,
# so this job runs the gate itself before the push and dispatches the
# publish. Minor and major releases stay the operator's signed cut.
on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Queue, never cancel: cancelling a gate run mid-check for a later trigger
# must never happen — queue behind it instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'push'
    # actions: read lets the verifier ask whether CI was green on the parent
    # of an automatic patch tag (verify-release-verdict.mjs, checkAutoPatch).
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need full history + previous tags

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1

      - name: Install
        # `bun install --frozen-lockfile` (not a plain `bun install`) even
        # though this package ships zero runtime dependencies -- that fact is
        # about the SHIPPED artifact, not about what runs IN THIS JOB. This
        # install still installs DEV tooling (tsc, etc), and that dev tooling
        # is CODE that runs here, inside a job that feeds the publish job's
        # OIDC-privileged install. Pinning it to the tracked, reviewed
        # bun.lock (kept in sync by scripts/version-sync-check.mjs) is what
        # buys real control over what code runs in CI -- do not "fix" this
        # back to a plain `bun install`. --ignore-scripts: a poisoned
        # transitive install script must not get to run here either.
        run: bun install --frozen-lockfile --ignore-scripts --cwd plugins/cool-workflow

      - name: Run deterministic release gate
        run: node plugins/cool-workflow/scripts/release-gate.mjs

      - name: Take the release verifier from origin/main, not from the tag
        # The checked-out tree IS the tag under judgment: a tag whose own
        # scripts/verify-release-verdict.mjs is `process.exit(0)` would pass any
        # check that runs it. So the verifier (and every local file it loads) is
        # read out of origin/main -- a ref the tag being judged cannot rewrite --
        # into $RUNNER_TEMP, and the next step runs it from there against the
        # tag checkout (its cwd). If origin/main cannot be fetched or lacks any
        # of these files, this step fails and nothing goes on (fail closed).
        # This step sits AFTER the gate (tag code) on purpose: copied any
        # earlier, release-gate.mjs could rewrite the copies before they run.
        # (On a tag push this whole file comes from the tag too, so here it is
        # defense in depth; what a tag cannot edit is the protected `npm`
        # environment and npm's Trusted Publisher setting -- see
        # npm-publish.yml's header.)
        run: |
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          VDIR="$RUNNER_TEMP/cw-release-verifier"
          rm -rf "$VDIR"
          mkdir -p "$VDIR"
          printf '{"type":"commonjs"}\n' > "$VDIR/package.json"
          for f in verify-release-verdict.mjs verify-verdict-signature.mjs verify-bump-reproduction.mjs fake-date-for-reproduction.mjs; do
            if ! git show "origin/main:plugins/cool-workflow/scripts/$f" > "$VDIR/$f" || [ ! -s "$VDIR/$f" ]; then
              echo "origin/main has no plugins/cool-workflow/scripts/$f -- refusing to verify with the tag's own copy" >&2
              exit 1
            fi
          done
          echo "release verifier taken from origin/main $(git rev-parse origin/main)"

      - name: Verify reviewer verdict was committed
        # The whole check (candidate loop, signature, bump-reproduction, and
        # the pubkey-from-origin/main rule) lives in the shared script — its
        # header comment is the one place the trust-chain rationale is kept.
        # Keeping this run: to one line also keeps the script's "::error::"
        # fail text out of the log of a green run (Actions prints a run:
        # step's full source before executing it).
        run: node "$RUNNER_TEMP/cw-release-verifier/verify-release-verdict.mjs" --context "The release flow was bypassed."
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release:
    if: github.event_name == 'push'
    needs: gate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        # Idempotent: the gated release-flow may have already created this
        # Release (with changelog notes) before the tag push reached CI. If so,
        # skip — making it again is an HTTP 422 "tag_name already exists" and a
        # false red run. Only create when no Release exists for this tag yet.
        #
        # REF_NAME goes through env:, not a raw ${{ }} substitution into the
        # script text — a tag name can contain shell metacharacters ($, `, ;,
        # (), etc; GitHub ref names forbid spaces but not those), and `${{ }}`
        # is textual substitution, not shell-quoted. Routing it through env:
        # and referencing "$REF_NAME" lets the shell quote it safely instead.
        run: |
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            echo "Release $REF_NAME already exists — nothing to do."
          else
            gh release create "$REF_NAME" \
              --title "$REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}

  auto-patch:
    # Only a push to main in this repository whose whole CI run concluded
    # success (a fork's pull request from a branch named main has event
    # pull_request, and another head repository).
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # The one job here that may write: it pushes one tag (contents), starts
    # npm-publish.yml and reads CI results (actions).
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI judged, never main's head at this moment.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history and tags: the plan reads the last release tag.
          fetch-depth: 0
          # The token is not left in .git/config: the gate below runs the
          # test suite, and only the tag push step is given the token.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1

      - name: Plan the patch release
        # Skips with one line (CW_AUTO_RELEASE=off, release bookkeeping,
        # already released, nothing shipped changed); fails when an operator
        # minor or major is pending. See scripts/release-auto-patch.mjs.
        id: plan
        run: node plugins/cool-workflow/scripts/release-auto-patch.mjs plan --sha "$HEAD_SHA"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CW_AUTO_RELEASE: ${{ vars.CW_AUTO_RELEASE }}

      - name: Install
        if: steps.plan.outputs.release == 'true'
        run: bun install --frozen-lockfile --ignore-scripts --cwd plugins/cool-workflow

      - name: Make the bump commit and tag (local only)
        if: steps.plan.outputs.release == 'true'
        run: node plugins/cool-workflow/scripts/release-auto-patch.mjs bump --sha "$HEAD_SHA" --version "$VERSION"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.plan.outputs.version }}

      - name: Run deterministic release gate on the tag commit
        # The gate release.yml's gate job runs on a tag push, run here
        # BEFORE the tag is pushed: a red gate leaves no tag behind.
        if: steps.plan.outputs.release == 'true'
        run: node plugins/cool-workflow/scripts/release-gate.mjs

      - name: Verify the tag as npm-publish.yml will
        # The same verifier, the same automatic patch rule (bump
        # reproduction, CI green on the parent): a tag it would refuse is
        # never pushed.
        if: steps.plan.outputs.release == 'true'
        run: node plugins/cool-workflow/scripts/verify-release-verdict.mjs --context "The automatic patch release would not pass its own check."
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Push only the tag
        # Never a branch: main is protected, and the bump commit lives only
        # on the tag (main lags behind npm on version surfaces).
        if: steps.plan.outputs.release == 'true'
        run: |
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "refs/tags/$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}

      - name: Start npm-publish on the tag
        # A tag pushed with GITHUB_TOKEN starts no tag-push run; a
        # workflow_dispatch does. The publish still waits for the operator's
        # approval in the protected `npm` environment.
        if: steps.plan.outputs.release == 'true'
        run: gh workflow run npm-publish.yml --ref "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}

      - name: Create GitHub Release
        if: steps.plan.outputs.release == 'true'
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
