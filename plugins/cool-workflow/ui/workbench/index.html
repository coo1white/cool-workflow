<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cool Workflow Workbench</title>
    <!-- Dependency-light: no framework, no bundler, no network. Static assets
         only; all data is fetched from the localhost read-only JSON routes. -->
    <link rel="stylesheet" href="/ui/app.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9"></path><path d="M4 12h6"></path><path d="M12 15l3 3 6-7"></path></svg></span>
        <h1>Cool Workflow <span class="muted">Workbench</span></h1>
      </div>
      <div class="bar">
        <p class="trust">read-only · localhost · re-derived from <code>.cw/</code> on every refresh</p>
        <button id="refresh" title="Re-derive from disk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 3v6h-6"></path></svg>Refresh</button>
      </div>
    </header>
    <main>
      <section id="index-panel" class="sidebar">
        <div class="bar">
          <h2>Runs</h2>
          <div id="registry-freshness" class="freshness"></div>
        </div>
        <input id="filter" type="search" placeholder="filter runs · app, status, text" aria-label="filter runs" />
        <ul id="run-list" class="run-list"></ul>
      </section>
      <section id="run-panel" class="detail">
        <p class="empty">Select a run to inspect its graph, blackboard, worker logs, candidate compare, and audit timeline.</p>
      </section>
    </main>
    <script src="/ui/navigation.js"></script>
    <script src="/ui/inspection.js"></script>
    <script src="/ui/app.js"></script>
  </body>
</html>
