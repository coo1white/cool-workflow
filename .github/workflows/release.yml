name: release
# Out-of-band backstop: re-runs the deterministic gate on every tag push.
# Local hooks can in principle be bypassed by an agent with shell access;
# this workflow cannot. Pair with a GitHub ruleset that protects refs/tags/v*
# so a red run blocks the release from being treated as published.
#
# The gate job re-checks the release; the release job (needs: gate) makes
# the GitHub Release. Folded from release-gate.yml + github-release.yml
# (sdlc/unify-ci-cd/plan.md packet C1) so npm-publish.yml's workflow_run
# chain has one release run to trust, not two.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Queue, never cancel: this gate's result is what npm-publish.yml trusts to
# decide whether to publish. Cancelling a run mid-check for a later trigger
# must never happen — queue behind it instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need full history + previous tags

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1

      - name: Install
        # `bun install --frozen-lockfile` (not a plain `bun install`) even
        # though this package ships zero runtime dependencies -- that fact is
        # about the SHIPPED artifact, not about what runs IN THIS JOB. This
        # install still installs DEV tooling (tsc, etc), and that dev tooling
        # is CODE that runs here, inside a job that feeds the publish job's
        # OIDC-privileged install. Pinning it to the tracked, reviewed
        # bun.lock (kept in sync by scripts/version-sync-check.js) is what
        # buys real control over what code runs in CI -- do not "fix" this
        # back to a plain `bun install`. --ignore-scripts: a poisoned
        # transitive install script must not get to run here either.
        run: bun install --frozen-lockfile --ignore-scripts --cwd plugins/cool-workflow

      - name: Run deterministic release gate
        run: node plugins/cool-workflow/scripts/release-gate.js

      - name: Verify reviewer verdict was committed
        # The whole check (candidate loop, signature, bump-reproduction, and
        # the pubkey-from-origin/main rule) lives in the shared script — its
        # header comment is the one place the trust-chain rationale is kept.
        # Keeping this run: to one line also keeps the script's "::error::"
        # fail text out of the log of a green run (Actions prints a run:
        # step's full source before executing it).
        run: node plugins/cool-workflow/scripts/verify-release-verdict.js --context "The release flow was bypassed."

  release:
    needs: gate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        # Idempotent: the gated release-flow may have already created this
        # Release (with changelog notes) before the tag push reached CI. If so,
        # skip — making it again is an HTTP 422 "tag_name already exists" and a
        # false red run. Only create when no Release exists for this tag yet.
        #
        # REF_NAME goes through env:, not a raw ${{ }} substitution into the
        # script text — a tag name can contain shell metacharacters ($, `, ;,
        # (), etc; GitHub ref names forbid spaces but not those), and `${{ }}`
        # is textual substitution, not shell-quoted. Routing it through env:
        # and referencing "$REF_NAME" lets the shell quote it safely instead.
        run: |
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            echo "Release $REF_NAME already exists — nothing to do."
          else
            gh release create "$REF_NAME" \
              --title "$REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
