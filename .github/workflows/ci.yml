name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cool-workflow:
    strategy:
      matrix:
        node-version: ["18", "22", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/cool-workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-package-lock --ignore-scripts
      # Zero runtime deps means this only ever audits the 3 devDependencies
      # (typescript, @types/node, undici-types), but a high/critical advisory
      # in any of them still runs in CI and in every contributor's install —
      # fail closed rather than finding out from an external report.
      - run: npm audit --audit-level=high
      - run: npm run build
      # Committed dist/ must equal a fresh build of src/ (fail closed on drift).
      # `git status --porcelain` catches modified AND added/deleted dist files;
      # `git diff` would miss untracked ones. release:check re-verifies via dist:check.
      - run: |
          drift="$(git status --porcelain -- dist)"
          if [ -n "$drift" ]; then
            echo "committed dist/ is stale — rebuild with 'npm run build' and commit:"
            echo "$drift"
            exit 1
          fi
      - run: npm run check
      - run: node scripts/cw.js list
      - run: node scripts/cw.js schedule list
      # Black-box regression net: the shipping cli.js must stay byte-identical
      # in observable behavior. The v0.2.0 GitHub Release notes make this
      # promise; it must run in CI or that promise is false.
      - run: node ../../v2/conformance/run.js --bin dist/cli.js
      # `test:coverage` already runs the full smoke suite; keep release:check for
      # the remaining parity, manifest, version-sync, golden-path, canonical-apps,
      # and eval gates without running the same suite a second time.
      - run: npm run test:coverage
      # Pure core/ unit tests (test/*.test.js), separate from the smoke suite
      # above — see test/run-unit.js's header. release:check --skip-tests also
      # skips this by name, so it does not run twice.
      - run: npm run test:unit
      - run: npm run release:check -- --skip-tests

  # macOS leg: the package ships a Homebrew formula, and the runtime does
  # file locking and TMPDIR work whose semantics are OS-specific. This job
  # runs the platform-sensitive core (build, conformance, full smoke suite,
  # unit tests) on one Node version. The platform-free gates (audit, dist
  # drift, release:check) stay on the ubuntu legs only. Not a required
  # check for merge; the two ubuntu legs (18, 22) keep that role.
  cool-workflow-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugins/cool-workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, same as the ubuntu legs. test:gate runs
          # verify-bump-reproduction-smoke.js, which reads this repo's REAL
          # release history (the v0.2.2 approved-parent/tagged-commit pair).
          # The default depth-1 checkout does not have those objects, so the
          # test dies with "exists on disk, but not in <commit>".
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm install --no-package-lock --ignore-scripts
      - run: npm run build
      - run: node ../../v2/conformance/run.js --bin dist/cli.js
      - run: npm run test:gate
      - run: npm run test:unit

  # Runs the release-reviewer smokes and the eval-replay harness smoke when
  # AGENTS.md or plugins/cool-workflow/agents/** change, since a bad agent
  # prompt is invisible to the other legs. Gated per job, not by a workflow-
  # level on.paths (that would also skip the three legs above): a step here
  # reads the changed files with git and sets an output; later steps run
  # only when it says yes. Not a required check.
  steering-config-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/cool-workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^(AGENTS\.md|plugins/cool-workflow/agents/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: "22"
      - run: npm install --no-package-lock --ignore-scripts
        if: steps.changed.outputs.run == 'true'
      - run: node test/run-all.js --filter 'release-flow'
        if: steps.changed.outputs.run == 'true'
      - run: npm run eval:replay
        if: steps.changed.outputs.run == 'true'
