name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        node-version: ["22", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/cool-workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile --ignore-scripts
      # Zero runtime deps means this only ever audits the 3 devDependencies
      # (typescript, @types/node, undici-types), but a high/critical advisory
      # in any of them still runs in CI and in every contributor's install —
      # fail closed rather than finding out from an external report.
      - run: bun audit --audit-level=high
      - run: bun run build
      # The CSS is built by Tailwind and committed like dist/; a stale copy
      # fails here, not on a user's screen.
      - run: bun run build:css && git diff --exit-code -- src/core/format/report-css.ts
      # Committed dist/ must equal a fresh build of src/ (fail closed on drift).
      # `git status --porcelain` catches modified AND added/deleted dist files;
      # `git diff` would miss untracked ones. release:check re-verifies via dist:check.
      - run: |
          drift="$(git status --porcelain -- dist)"
          if [ -n "$drift" ]; then
            echo "committed dist/ is stale — rebuild with 'bun run build' and commit:"
            echo "$drift"
            exit 1
          fi
      - run: bun run check
      - run: node scripts/cw.js version
      # Black-box regression net: the shipping cli.js must stay byte-identical
      # in observable behavior. The v0.2.0 GitHub Release notes make this
      # promise; it must run in CI or that promise is false.
      - run: node ../../v2/conformance/run.mjs --bin dist/cli.js
      # `test:coverage` already runs the full smoke suite; keep release:check for
      # the remaining manifest, version-sync and docs gates without running the
      # same suite a second time.
      - run: bun run test:coverage
      # Pure core/ unit tests (test/**/*.test.mjs), separate from the smoke suite
      # above — see test/run-unit.mjs's header. release:check --skip-tests also
      # skips this by name, so it does not run twice.
      - run: bun run test:unit
      - run: bun run release:check -- --skip-tests

  # macOS leg: the package ships a Homebrew formula, and the runtime does
  # file locking and TMPDIR work whose semantics are OS-specific. This job
  # runs the platform-sensitive core (build, conformance, full smoke suite,
  # unit tests) on one Node version. The platform-free gates (audit, dist
  # drift, release:check) stay on the ubuntu legs only. Not a required
  # check for merge; the two ubuntu legs (22, 24) keep that role.
  cool-workflow-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugins/cool-workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, same as the ubuntu legs. test:gate runs
          # verify-bump-reproduction-smoke.mjs, which reads this repo's REAL
          # release history (the v0.2.2 approved-parent/tagged-commit pair).
          # The default depth-1 checkout does not have those objects, so the
          # test dies with "exists on disk, but not in <commit>".
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: node ../../v2/conformance/run.mjs --bin dist/cli.js
      - run: bun run test:gate
      - run: bun run test:unit

  # Windows leg, a MEASURING leg for now: native Windows is not yet a
  # supported platform (README says so). Each test step may fail without
  # failing the job; the last step writes the pass/fail counts and the
  # failing files to the job summary, so the real gap is a number, not a
  # guess. The next step (a known-failures list that can only get shorter)
  # turns this into a gate. Not a required check.
  cool-workflow-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: plugins/cool-workflow
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: node dist/cli.js help > /dev/null
      - run: node ../../v2/conformance/run.mjs --bin dist/cli.js
        continue-on-error: true
      - run: node test/run-all.mjs --json-summary windows-smokes.json
        continue-on-error: true
      - run: bun run test:unit
        continue-on-error: true
      - if: always()
        run: |
          node -e '
            const fs = require("fs");
            let text = "### Windows smoke suite\n\n";
            if (!fs.existsSync("windows-smokes.json")) text += "No summary was written (the runner did not finish).\n";
            else {
              const s = JSON.parse(fs.readFileSync("windows-smokes.json", "utf8"));
              const bad = s.results.filter((r) => !r.ok).map((r) => r.file).sort();
              text += `${s.results.length - bad.length}/${s.results.length} passed, ${bad.length} failed.\n\n`;
              for (const f of bad) text += `- ${f}\n`;
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
            process.stdout.write(text);
          '

  # A fix needs a test that fails before it (AGENTS.md, Iteration Loop). On
  # a pull request that changes plugins/cool-workflow/src/, this job copies
  # the changed test files into a git worktree at the merge base and runs
  # them there against that base's committed dist/; at least one must fail.
  # A PR with no src change passes at once. Not a required check.
  fails-before:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/cool-workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base must be in the clone; the script fails closed
          # on a shallow one.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node scripts/fails-before-check.mjs --base "${{ github.event.pull_request.base.sha }}"

  # Runs the release-reviewer smokes and the eval-replay harness smoke when
  # AGENTS.md or plugins/cool-workflow/agents/** change, since a bad agent
  # prompt is invisible to the other legs. Gated per job, not by a workflow-
  # level on.paths (that would also skip the three legs above): a step here
  # reads the changed files with git and sets an output; later steps run
  # only when it says yes. Not a required check.
  steering-config-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/cool-workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^(AGENTS\.md|plugins/cool-workflow/agents/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.changed.outputs.run == 'true'
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile --ignore-scripts
        if: steps.changed.outputs.run == 'true'
      - run: node test/run-all.mjs --filter 'release-flow'
        if: steps.changed.outputs.run == 'true'

  # Rehearses the gated release on every PR or main push that touches release
  # tooling, so a break shows here and not on the
  # operator's machine during a real cut. Gated per job like
  # steering-config-gate above: a step reads the changed files with git and
  # sets an output; later steps run only when it says yes. It runs the real
  # flow in check mode: version sync, release-flow.mjs --check --local-tests
  # (the deterministic gate: build, full test:gate, substance, test evidence,
  # branch naming; then the reviewer spawn and verdict check). --local-tests is
  # needed here: by default the gate's test step reads the required `check`
  # runs on the commit, and this job runs beside them, so it cannot wait on
  # them. The reviewer is a
  # STUB (test/fixtures/release-rehearsal-reviewer.mjs), there is no signing
  # key, and nothing is tagged, pushed, or published. The npm leg runs the
  # newest npm as well as the one bundled with Node 24: npm 12 changed the
  # npm pack --json shape and broke the release check on a real cut. Not a
  # required check; keep it out of branch protection.
  release-rehearsal:
    strategy:
      fail-fast: false
      matrix:
        npm: ["bundled", "latest"]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: plugins/cool-workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: release-gate.mjs finds the previous release
          # tag by semver and fails closed on a shallow clone.
          fetch-depth: 0
      - id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^(plugins/cool-workflow/scripts/(release-[^/]*|verify-[^/]*|bump-version)\.mjs|plugins/cool-workflow/test/(run-all|fixtures/release-rehearsal-reviewer)\.mjs|plugins/cool-workflow/package\.json|plugins/cool-workflow/agents/release-reviewer\.md|\.cw-release/.*|\.github/workflows/(ci|release|npm-publish)\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: "24"
      - run: npm install -g npm@latest
        if: steps.changed.outputs.run == 'true' && matrix.npm == 'latest'
      - run: node --version && npm --version
        if: steps.changed.outputs.run == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.changed.outputs.run == 'true'
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile --ignore-scripts
        if: steps.changed.outputs.run == 'true'
      # The release scripts call npm, not bun: run them the same way here.
      - run: npm run build
        if: steps.changed.outputs.run == 'true'
      - run: npm run version:sync
        if: steps.changed.outputs.run == 'true'
      # GITHUB_HEAD_REF (set on a PR) is what release-gate.mjs judges for
      # branch naming on the detached merge checkout.
      - run: node scripts/release-flow.mjs --check --local-tests
        if: steps.changed.outputs.run == 'true'
        env:
          CW_AGENT_COMMAND: node plugins/cool-workflow/test/fixtures/release-rehearsal-reviewer.mjs {{input}}
