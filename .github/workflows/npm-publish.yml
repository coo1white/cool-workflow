name: npm-publish

# Publish cool-workflow to npm when a release tag is pushed (or on manual
# dispatch for an existing tag). A v* tag can only land after the gated release
# flow (deterministic gate -> independent reviewer -> verdict -> the
# block-unapproved-tag hook). This job does NOT trust the workflow_run
# trigger's "release-gate succeeded" report by itself -- release-gate.yml runs
# FROM THE PUSHED TAG'S OWN TREE, which for a tag push IS attacker-controlled
# input; a tag that rewrote release-gate.yml to `exit 0` would make that report
# say "success" with no real check ever run. So this job independently
# re-verifies the committed, signed verdict itself, on EVERY trigger (both
# workflow_run and workflow_dispatch), against .cw-release/verdict-signing.pub
# as committed on origin/main (a ref the tag being judged cannot rewrite) --
# see the "Verify the dispatched ref is a real, gated release tag" step below,
# which despite its name now runs unconditionally and is the true source of
# truth for this job, not release-gate.yml's reported conclusion. On top of
# that, the tag must match the committed package version, so a stray tag can
# never publish a mismatched artifact.
# Publishes through npm Trusted Publishing with provenance — a
# cryptographic attestation that this exact version was built from this public
# repo in CI, on-brand for an auditable control-plane and impossible to forge
# for a hand-published tarball. No long-lived npm publish token is needed.

on:
  workflow_run:
    workflows: ["release-gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to publish (e.g. v0.1.79)"
        required: true

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing / provenance

# Queue, never cancel: keyed on the same ref/sha expression used below to
# resolve the checkout (workflow_run has no github.ref for this trigger). A
# duplicate trigger for the same tag must queue behind an in-flight publish,
# never cancel it mid-`npm publish`.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.ref || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    # Gate as a job-level condition (NOT a pre-checkout run-step): on workflow_run
    # only proceed if release-gate succeeded; workflow_dispatch is always allowed.
    # A run-step here would execute under the job's working-directory before
    # actions/checkout has created it, so the shell could not even start.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/cool-workflow
    steps:
      # Pinned by commit SHA (not the moving @v5 tag) — this job holds the
      # npm Trusted Publishing OIDC token, so a compromise of the actions org
      # re-tagging @v5 to a malicious commit must not silently flow in here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the exact commit the gate ran on (a tag commit); on dispatch,
          # the operator-supplied tag. fetch-depth 0 + tags so we can resolve the
          # tag name from the commit below.
          ref: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Use npm with Trusted Publishing support
        # Exact pin (no ^ range): this job holds the npm Trusted Publishing
        # OIDC token, so npm itself is code we do not want to float on a
        # compromised upstream release.
        run: npm install -g npm@11.5.1
      - name: Resolve the release tag from the commit
        id: tagref
        # INPUT_REF/HEAD_SHA go through env:, not raw ${{ }} text substitution —
        # INPUT_REF is an operator-supplied dispatch string and could carry
        # shell metacharacters ($, `, ;, etc); env: + "$VAR" lets the shell
        # quote it safely instead of splicing it into the script text.
        run: |
          if [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
          else
            # workflow_run: head_branch is the triggering branch (e.g. 'main'), NOT
            # the tag — derive the tag from the commit the gate actually ran on.
            REF="$(git describe --tags --exact-match "$HEAD_SHA")"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "resolved release tag: $REF"
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Verify the tag matches the committed package version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          REF="$TAG_REF"
          TAG="${REF#v}"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package version $PKG — refusing to publish a mismatched artifact"
            exit 1
          fi
        env:
          TAG_REF: ${{ steps.tagref.outputs.ref }}
      - name: Verify the dispatched ref is a real, gated release tag
        # This step now runs on EVERY invocation of this job (both the normal
        # workflow_run path after a tag push, and workflow_dispatch), not just
        # on dispatch. It is the actual source of truth for "was this release
        # really gated and reviewed" -- release-gate.yml's reported conclusion
        # (checked in the job-level `if:` above) is NOT enough by itself,
        # because release-gate.yml runs from the pushed tag's OWN tree, which
        # for a tag push is attacker-controlled input; a tag that rewrote that
        # workflow file to `exit 0` would still report "success" with no real
        # check ever having run. So this step independently re-derives the tag
        # ($TAG_REF, already resolved correctly for BOTH trigger types by the
        # earlier "Resolve the release tag from the commit" step), requires
        # refs/tags/$TAG_REF to exist as a real tag object, requires the
        # checked-out commit to be exactly that tag's commit (blocks a
        # same-named branch standing in for the tag), and re-runs the full
        # verdict check -- including its signature check and its
        # deterministic-bump-reproduction check (verify-bump-reproduction.js),
        # if .cw-release/verdict-signing.pub is committed (see verdict-keygen.js).
        # A validly-signed verdict for the PARENT alone does not prove HEAD is
        # the same mechanical bump release-flow.js's cut() would have produced —
        # the shared script's header comment keeps the full rationale. The
        # tag-identity checks below are THIS file's own logic; the verdict
        # check itself is delegated to verify-release-verdict.js, which does
        # not care about the cwd (it anchors itself on
        # `git rev-parse --show-toplevel`).
        run: |
          REF="$TAG_REF"
          TAG_SHA="$(git rev-parse --verify "refs/tags/$REF^{commit}" 2>/dev/null)" || {
            echo "::error::refs/tags/$REF does not exist — the ref being published must be a real, pushed release tag, not a branch"
            exit 1
          }
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::checked-out commit $HEAD_SHA does not match refs/tags/$REF ($TAG_SHA) — refusing to publish"
            exit 1
          fi
          node scripts/verify-release-verdict.js --context "Publishing cannot be used to skip the gated release flow."
        env:
          TAG_REF: ${{ steps.tagref.outputs.ref }}
      - name: Verify committed dist/ matches source (fail closed on drift)
        run: |
          # npm ci (not `npm install --no-package-lock`): this job holds the npm
          # Trusted Publishing OIDC token, so the dev tooling `npm run build`
          # runs next (tsc, etc) is code we want pinned to the tracked, reviewed
          # package-lock.json, not floating. --ignore-scripts: a poisoned
          # transitive install script must not get to run here either.
          npm ci --ignore-scripts
          npm run build
          drift="$(git status --porcelain -- dist)"
          if [ -n "$drift" ]; then
            echo "::error::committed dist/ is stale — rebuild with 'npm run build' and commit:"
            echo "$drift"
            exit 1
          fi
          echo "dist/ is fresh — proceeding to publish"
      - name: Skip if this version is already published (idempotent re-run)
        id: published
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "cool-workflow@$PKG" version >/dev/null 2>&1; then
            echo "cool-workflow@$PKG is already on npm — skipping publish. A tag move or"
            echo "re-dispatch must never double-publish or fail closed on an already-shipped version."
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm (with provenance)
        if: steps.published.outputs.already != 'true'
        run: npm publish --access public
